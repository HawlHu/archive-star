  <script>
    $(function() {
      const canvas = document.getElementById("snowCanvas");
      const ctx = canvas.getContext("2d");

      let w = window.innerWidth;
      let h = window.innerHeight;
      canvas.width = w;
      canvas.height = h;

	  document.body.style.background = "url('" + bgi_s + "') no-repeat center center fixed";
	  document.body.style.backgroundSize = "cover";
	  
      const snowCount = snum_s; // 雪花數量
      const snows = [];

      // 初始化雪花
      for (let i = 0; i < snowCount; i++) {
        snows.push({
          x: Math.random() * w,
          y: Math.random() * h,
          r: Math.random() * 3 + 1, // 半徑
          d: Math.random() * snowCount // 密度
        });
      }

	function drawSnow() {
	  ctx.clearRect(0, 0, w, h);
	  ctx.beginPath();
	  for (let i = 0; i < snowCount; i++) {
		const s = snows[i];
		
		// 計算透明度，避免超出範圍
		const opacity = Math.max(0, Math.min(1, 1 - (s.y / h)));
	
		ctx.fillStyle = `rgba(255, 255, 255, ${opacity})`;
		ctx.beginPath();
		ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2, true);
		ctx.fill();
	  }
	  moveSnow();
	}

      let angle = 0;

      function moveSnow() {
        angle += 0.01;
        for (let i = 0; i < snowCount; i++) {
          const s = snows[i];
          s.y += Math.cos(angle + s.d) + 1 + s.r / 2;
          s.x += Math.sin(angle) * 2;

          // 超出畫布時重設位置
          if (s.x > w || s.x < 0 || s.y > h) {
            snows[i] = {
              x: Math.random() * w,
              y: 0,
              r: s.r,
              d: s.d
            };
          }
        }
      }

      setInterval(drawSnow, 33);

      // 窗口大小改變時自動調整
      $(window).resize(function() {
        w = window.innerWidth;
        h = window.innerHeight;
        canvas.width = w;
        canvas.height = h;
      });
	  
	  
    });
  </script>
