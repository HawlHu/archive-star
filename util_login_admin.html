					//Get UrlData
						function queryString (){
							// This function is anonymous, is executed immediately and
							// the return value is assigned to QueryString!
							var query_string = {};
							var query = window.location.search.substring(1);
							var vars = query.split("&");
							for (var i = 0; i < vars.length; i++){
								var pair = vars[i].split("=");
								// If first entry with this name
								if (typeof query_string[pair[0]] === "undefined"){
									query_string[pair[0]] = pair[1];
									// If second entry with this name
								} else if (typeof query_string[pair[0]] === "string"){
									var arr = [query_string[pair[0]], pair[1]];
									query_string[pair[0]] = arr;
									// If third or later entry with this name
								} else{
									query_string[pair[0]].push(pair[1]);
								}
							}
							return query_string;
						}
				
				
					//登入資訊回拋
						function loginstart_callback(aes_data_law,uname_display,user_group){
					
							//AES確認
								if(readCookie("j_aeskey")==""){
								
									//基本 AES資料防呆
										if(aes_data_law.replace("U2FsdGVkX1","")!=aes_data_law){
												try { 
													writeCookie("j_aeskey", 
																	AesDecrypt(
																		aes_data_law,
																		ex_md1( 
																					web_system_main_json_datas.user_key_in_user + 
																					web_system_main_json_datas.user_login_center_key + 
																					web_system_main_json_datas.user_key_in_pass
																				)
																	), 
																	web_system_main_json_datas.user_login_cookie_max_sec
																);
													
													//紀錄登入資訊
														writeCookie("j_system_login_cname", uname_display, web_system_main_json_datas.user_login_cookie_max_sec);
														writeCookie("j_system_login_group", user_group, web_system_main_json_datas.user_login_cookie_max_sec);
														
														
													//跳轉
														var qs_data 	   = queryString();
														var qa_data_out	   = decodeURIComponent(qs_data.o);
														if(qa_data_out==""){
															qa_data_out	= "./";
														}
														window.location=	qa_data_out + "?rid=" +  new Date().getTime();
												
												} catch (error) {}
												
										}else{}
								
								} else {}
						
						}
					
					
						
					
				   //開始登入
					   function loginstart(){
							
							
							if(document.getElementById('man_check').value==""){
									show_message("登入失敗!(帳號或者密碼、驗證碼錯誤，或者該帳號已停用、資料庫沒有回應)");
							}else{
									
									if(easy_man_check_gen_a_num_check(document.getElementById('man_check').value,4,600,1000,easy_man_check_gen_a_num_in_key_num)==false){
											show_message("登入失敗!(帳號或者密碼、驗證碼錯誤，或者該帳號已停用、資料庫沒有回應)");
									}else{
											if(readCookie("j_aeskey")!=""){
													//偵測到重覆登入
														window.location="./";
											}else{
					
													//帳號
														setTimeout(function(){
																	show_message("登入失敗!(帳號或者密碼、驗證碼錯誤，或者該帳號已停用、資料庫沒有回應)");
																	history.go(0);
														},web_system_main_json_datas.user_login_page_dl_time);
														
														//開始
															web_system_main_json_datas.user_key_in_user=document.getElementById('username').value;
															web_system_main_json_datas.user_key_in_pass=document.getElementById('password').value;
															web_system_main_json_datas.user_login_page_gpobj.src = "db/user_"+web_system_main_json_datas.user_key_in_user+".js?rid=" + new Date().getTime();
															
															document.getElementById('data_center_area').innerHTML="<div class=loader></div>"; //動畫
							
															if(pw_test_check(web_system_main_json_datas.user_key_in_pass,web_system_main_json_datas.user_key_in_pass.length)>=3){
																	//載入密鑰
																		setTimeout(function(){
																				document.head.appendChild(web_system_main_json_datas.user_login_page_gpobj);
																		},web_system_main_json_datas.user_login_page_st_time);
																		
															}else{
															}
												
											}
									
									}
							
							}
					   }
