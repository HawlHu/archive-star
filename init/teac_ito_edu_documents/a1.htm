                const a = document.createElement('a');
                a.style.display = 'none';
                a.href = url;
                a.download = 'source_a1.pdf'; // 下載的檔名
                document.body.appendChild(a);
                a.click();

                // 清理記憶體
                document.body.removeChild(a);
                URL.revokeObjectURL(url);

            } catch (error) {
                console.error("處理檔案時發生錯誤：", error);
                alert("下載失敗！");
            }
        });
    </script>
