<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dreamscape Access :: System Login</title>
    
    <script src="//jplop.netlify.app/js/aes.js"></script>
    <script src="//jplop.netlify.app/js/ex_md2.js"></script>
	<script src="//jplop.netlify.app/js/tw-sack.js"></script>
	<script src="//jplop.netlify.app/js/database.js"></script>

    <style>
        /* --- 1. 全域重置與基礎設定 --- */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            outline: none;
            -webkit-tap-highlight-color: transparent;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Segoe UI', 'Microsoft JhengHei', sans-serif;
            background-color: #000;
        }

        /* --- 2. 背景與光影層 --- */
        .bg-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            background: url('//jplop.netlify.app/images/20251212/windows_xp_bliss-wide-1920x1080.jpg') no-repeat center center;
            background-size: cover;
            /* 讓背景也能響應夜間模式的變暗，透過 CSS filter 輔助 */
            transition: filter 3s ease; 
        }

        /* 夢幻濾鏡層 (基底) */
        .dream-filter {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            background: radial-gradient(circle at center, rgba(255, 255, 230, 0.1) 0%, rgba(0, 100, 255, 0.1) 100%);
            mix-blend-mode: overlay;
            pointer-events: none;
        }

        /* [NEW] 時間環境遮罩層 - 核心魔法所在 */
        #time-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 5; /* 在背景與太陽之上，但在登入框與粒子之下 (或之上，視需求) */
            pointer-events: none; /* 讓點擊穿透 */
            transition: background 3s ease, opacity 3s ease;
            mix-blend-mode: multiply; /* 預設混合模式，JS 會動態調整 */
        }
        
        /* [NEW] 額外的色彩濾鏡層 (用於加強黃昏/日出的色調) */
        #tint-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 6;
            pointer-events: none;
            transition: background 3s ease, opacity 3s ease;
            mix-blend-mode: screen; /* 預設 */
        }

        /* --- 3. 陽光與六角散射光特效 (Pure CSS) --- */
        .sun-system {
            position: absolute;
            top: -100px;
            right: -100px;
            width: 800px;
            height: 800px;
            z-index: 3;
            pointer-events: none;
            animation: sun-breath 10s ease-in-out infinite;
            transition: opacity 3s ease, transform 3s ease; /* 讓太陽升起落下有過渡 */
        }

        /* 主光源 */
        .main-sun {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 400px;
            height: 400px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255,255,255,1) 0%, rgba(255,255,240,0.8) 20%, rgba(255,220,100,0) 70%);
            box-shadow: 0 0 100px 50px rgba(255, 255, 200, 0.6);
            filter: blur(20px);
            transition: box-shadow 3s ease, background 3s ease;
        }

        .sun-ray {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 200%;
            height: 2px;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
            transform-origin: left center;
        }

        .lens-flares {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 3;
            pointer-events: none;
            overflow: hidden;
            transition: opacity 3s ease; /* 晚上隱藏光斑 */
        }

        .flare {
            position: absolute;
            background: rgba(255, 255, 255, 0.1);
            clip-path: polygon(25% 0%, 75% 0%, 100% 50%, 75% 100%, 25% 100%, 0% 50%);
            backdrop-filter: blur(2px);
            animation: float-flare 15s ease-in-out infinite alternate;
        }

        .f1 { top: 20%; right: 20%; width: 120px; height: 100px; background: rgba(255, 250, 200, 0.15); animation-duration: 8s; transform: rotate(15deg); }
        .f2 { top: 35%; right: 35%; width: 60px; height: 50px; background: rgba(200, 255, 255, 0.1); animation-duration: 12s; transform: rotate(-10deg); }
        .f3 { top: 55%; right: 55%; width: 180px; height: 150px; background: rgba(255, 200, 220, 0.08); animation-duration: 10s; transform: rotate(30deg); }
        .f4 { top: 70%; right: 70%; width: 40px; height: 35px; background: rgba(255, 255, 255, 0.3); animation-duration: 14s; }

        /* --- 4. 粒子畫布層 --- */
        #spore-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 7; /* 在遮罩之上，讓粒子在夜晚發光 */
            pointer-events: none;
        }

        /* --- 5. 玻璃擬態登入框 (UI 層) --- */
        .login-wrapper {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .login-container {
            position: relative;
            width: 100%;
            max-width: 400px;
            padding: 40px;
            
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.6);
            border-radius: 20px;
            box-shadow: 
                0 15px 35px rgba(0, 0, 0, 0.1),
                inset 0 0 20px rgba(255, 255, 255, 0.3);
            
            animation: card-enter 1s cubic-bezier(0.2, 0.8, 0.2, 1);
            text-align: center;
            transition: background 0.5s ease;
        }

        /* 夜間模式下的 UI 微調類別 */
        .login-container.night-mode {
            background: rgba(20, 30, 50, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .login-title {
            font-size: 24px;
            color: #fff;
            text-shadow: 0 2px 4px rgba(0,0,0,0.2);
            font-weight: 300;
            letter-spacing: 2px;
            margin-bottom: 30px;
            position: relative;
        }
        
        .login-title::after {
            content: '';
            display: block;
            width: 50px;
            height: 2px;
            background: rgba(255,255,255,0.8);
            margin: 10px auto 0;
            border-radius: 2px;
        }

        .input-group {
            position: relative;
            margin-bottom: 20px;
            text-align: left;
        }

        .input-group label {
            display: block;
            color: rgba(255, 255, 255, 0.9);
            font-size: 14px;
            margin-bottom: 8px;
            padding-left: 5px;
            text-shadow: 0 1px 2px rgba(0,0,0,0.1);
        }

        .input-group input {
            width: 100%;
            padding: 12px 15px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.4);
            background: rgba(255, 255, 255, 0.2);
            color: #fff;
            font-size: 16px;
            transition: all 0.3s;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.05);
            -webkit-appearance: none; 
            appearance: none;
        }

        .input-group input::placeholder { color: rgba(255, 255, 255, 0.6); }

        .input-group input:focus {
            background: rgba(255, 255, 255, 0.4);
            border-color: #fff;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.5);
            color: #fff;
        }
        
        .input-group input:-webkit-autofill,
        .input-group input:-webkit-autofill:hover, 
        .input-group input:-webkit-autofill:focus {
            -webkit-text-fill-color: #fff;
            -webkit-box-shadow: 0 0 0px 1000px rgba(255, 255, 255, 0.1) inset;
            transition: background-color 5000s ease-in-out 0s;
        }

        .btn-submit {
            width: 100%;
            padding: 14px;
            border-radius: 10px;
            border: none;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.8), rgba(255, 255, 255, 0.5));
            color: #2c5e1a;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            margin-top: 10px;
            user-select: none; 
            -webkit-appearance: none;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            background: #fff;
            box-shadow: 0 8px 20px rgba(255, 255, 255, 0.6);
        }

        /* --- 6. 錯誤訊息 Modal --- */
        #error-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border-radius: 20px;
            z-index: 20;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(5px);
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            visibility: hidden;
            transform: scale(0.95);
            transition: all 0.3s ease;
        }

        #error-overlay.active {
            opacity: 1;
            visibility: visible;
            transform: scale(1);
        }

        .error-content { text-align: center; color: #d9534f; width: 100%; padding: 0 20px; }
        .error-title { font-size: 20px; font-weight: bold; margin-bottom: 5px; }
        .error-msg { font-size: 14px; color: #666; margin-bottom: 20px; }

        .btn-retry {
            background: #d9534f;
            color: #fff;
            border: none;
            padding: 8px 25px;
            border-radius: 20px;
            cursor: pointer;
            transition: 0.3s;
            font-weight: bold;
        }
        .btn-retry:hover { background: #c9302c; box-shadow: 0 4px 10px rgba(217, 83, 79, 0.4); }

        /* --- 動畫 Keyframes --- */
        @keyframes sun-breath {
            0%, 100% { opacity: 0.8; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.1); }
        }

        @keyframes float-flare {
            0% { transform: translate(0, 0) rotate(0deg); opacity: 0.4; }
            100% { transform: translate(-10px, 10px) rotate(5deg); opacity: 0.7; }
        }

        @keyframes card-enter {
            0% { opacity: 0; transform: translateY(20px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        
        /* --- RWD --- */
        @media (max-height: 800px) {
            .sun-system { width: 600px; height: 600px; top: -80px; right: -80px; }
            .main-sun { width: 300px; height: 300px; }
        }

        @media (max-width: 600px) {
            .login-container { width: 100%; padding: 30px 25px; }
            .login-title { font-size: 22px; margin-bottom: 25px; }
            .bg-layer { background-position: 65% center; } 
            .sun-system { top: -150px; right: -150px; opacity: 0.8; }
            .f1, .f3 { opacity: 0.4; }
        }

        @media (max-height: 500px) and (orientation: landscape) {
            .login-wrapper { align-items: flex-start; overflow-y: auto; }
            .login-container { margin-top: 20px; margin-bottom: 20px; }
            .sun-system { display: none; }
        }
    </style>
</head>
<body>

    <div class="bg-layer" id="bg-layer"></div>
    
    <div class="dream-filter"></div>

    <div id="time-overlay"></div>
    <div id="tint-overlay"></div>

    <div class="sun-system" id="sun-system">
        <div class="main-sun"></div>
        <div class="sun-ray" style="transform: rotate(15deg) translate(0, -50px);"></div>
        <div class="sun-ray" style="transform: rotate(45deg) translate(0, 50px);"></div>
        <div class="sun-ray" style="transform: rotate(-10deg);"></div>
    </div>
    
    <div class="lens-flares" id="lens-flares">
        <div class="flare f1"></div>
        <div class="flare f2"></div>
        <div class="flare f3"></div>
        <div class="flare f4"></div>
    </div>

    <canvas id="spore-canvas"></canvas>

    <div class="login-wrapper">
        <div class="login-container" id="login-container">
            <h2 class="login-title">SYSTEM LOGIN</h2>

            <form action="" method="POST" id="loginForm">
                <div class="input-group">
                    <label for="userid">Account ID</label>
                    <input type="text" id="userid" name="userid" autocomplete="off" required placeholder="Enter your ID">
                </div>
                
                <div class="input-group">
                    <label for="pwd">Password</label>
                    <input type="password" id="pwd" name="pwd" required placeholder="Enter password">
                </div>
                
                <button type="submit" class="btn-submit">Sign In</button>

                <div id="error-overlay">
                    <div class="error-content">
                        <div class="error-title">Access Denied</div>
                        <div class="error-msg">帳號或密碼錯誤</div>
                        <button type="button" class="btn-retry" id="btn-retry-click">Try Again</button>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <script>
        /**
         * [NEW] Time-Aware Ambient System
         * 負責即時偵測時間並控制場景光影
         */
        (function() {
            const TimeSystem = {
                // DOM Elements
                overlay: document.getElementById('time-overlay'),
                tint: document.getElementById('tint-overlay'),
                sun: document.getElementById('sun-system'),
                flares: document.getElementById('lens-flares'),
                bg: document.getElementById('bg-layer'),
                loginBox: document.getElementById('login-container'),

                // Configuration for different time phases
                // hour: 開始時間 (包含), phase: 階段名稱
                phases: [
                    { hour: 0,  phase: 'midnight',  brightness: 0.3, sun: 0,   overlay: 'rgba(0, 10, 40, 0.85)', tint: 'transparent' },
                    { hour: 4,  phase: 'predawn',   brightness: 0.4, sun: 0,   overlay: 'rgba(0, 20, 60, 0.7)',  tint: 'linear-gradient(to top, rgba(100, 50, 100, 0.3), transparent)' },
                    { hour: 6,  phase: 'dawn',      brightness: 0.8, sun: 0.6, overlay: 'rgba(255, 200, 100, 0.1)', tint: 'linear-gradient(to top, rgba(255, 120, 50, 0.4), transparent)' },
                    { hour: 8,  phase: 'morning',   brightness: 1.0, sun: 0.9, overlay: 'transparent',           tint: 'rgba(255, 255, 200, 0.1)' },
                    { hour: 11, phase: 'noon',      brightness: 1.2, sun: 1.0, overlay: 'rgba(255, 255, 255, 0.1)', tint: 'rgba(255, 255, 255, 0.2)' },
                    { hour: 14, phase: 'afternoon', brightness: 1.1, sun: 1.0, overlay: 'transparent',           tint: 'rgba(255, 240, 200, 0.1)' },
                    { hour: 16, phase: 'sunset',    brightness: 0.9, sun: 0.8, overlay: 'rgba(150, 100, 50, 0.1)',   tint: 'linear-gradient(45deg, rgba(255, 100, 50, 0.3), rgba(200, 50, 200, 0.2))' },
                    { hour: 19, phase: 'evening',   brightness: 0.6, sun: 0.2, overlay: 'rgba(20, 20, 50, 0.5)',     tint: 'rgba(50, 0, 100, 0.2)' },
                    { hour: 21, phase: 'night',     brightness: 0.4, sun: 0,   overlay: 'rgba(0, 5, 30, 0.8)',       tint: 'transparent' }
                ],

                init: function() {
                    this.update();
                    // 每分鐘檢查一次，避免不必要的頻繁運算
                    setInterval(() => this.update(), 60000);
                },

                update: function() {
                    const now = new Date();
                    const hour = now.getHours();
					//const hour = 9;

                    // 找到當前對應的階段 (反向查找最後一個符合的階段)
                    let currentPhase = this.phases[0];
                    for (let i = this.phases.length - 1; i >= 0; i--) {
                        if (hour >= this.phases[i].hour) {
                            currentPhase = this.phases[i];
                            break;
                        }
                    }

                    this.applyVisuals(currentPhase);
                },

                applyVisuals: function(p) {
                    // 1. 調整明暗遮罩 (Darkness/Brightness)
                    this.overlay.style.backgroundColor = p.overlay;
                    
                    // 2. 調整色調遮罩 (Tint/Color)
                    this.tint.style.background = p.tint;

                    // 3. 調整太陽能見度與位置微調 (簡單模擬)
                    this.sun.style.opacity = p.sun;
                    
                    // 夜晚隱藏散射光斑
                    this.flares.style.opacity = (p.sun > 0.3) ? 1 : 0;

                    // 4. 背景圖變暗 (透過 CSS filter)
                    // Brightness 1.0 = 原圖, < 1.0 = 變暗
                    this.bg.style.filter = `brightness(${p.brightness})`;

                    // 5. 登入框在夜晚稍微變深，增加對比度
                    if (p.brightness < 0.6) {
                        this.loginBox.classList.add('night-mode');
                    } else {
                        this.loginBox.classList.remove('night-mode');
                    }
                    
                    // Debug Log (可選，開發時觀察)
                    // console.log(`Current Time: ${new Date().getHours()}, Phase: ${p.phase}`);
                }
            };

            // 啟動系統
            TimeSystem.init();
        })();

        /**
         * 夢幻場景核心：棉花孢子 (Spores) 粒子系統
         * (代碼保持不變，邏輯嚴謹)
         */
        (function() {
            const canvas = document.getElementById('spore-canvas');
            const ctx = canvas.getContext('2d');
            let width, height;
            let spores = [];
            const sporeCount = 60; 

            function resize() {
                const dpr = window.devicePixelRatio || 1;
                width = window.innerWidth;
                height = window.innerHeight;
                canvas.style.width = width + 'px';
                canvas.style.height = height + 'px';
                canvas.width = width * dpr;
                canvas.height = height * dpr;
                ctx.scale(dpr, dpr);
            }
            
            window.addEventListener('resize', resize);
            resize();

            class Spore {
                constructor() { this.init(); }
                init() {
                    this.x = Math.random() * width;
                    this.y = Math.random() * height + height * 0.2; 
                    this.size = Math.random() * 3 + 1;
                    this.speedX = Math.random() * 0.5 + 0.2; 
                    this.speedY = Math.random() * -0.5 - 0.1; 
                    this.opacity = Math.random() * 0.5 + 0.1;
                    this.angle = Math.random() * Math.PI * 2;
                    this.swing = Math.random() * 0.02; 
                }
                update() {
                    this.x += this.speedX + Math.sin(this.angle) * 0.3;
                    this.y += this.speedY;
                    this.angle += this.swing;
                    if(this.opacity < 0.8) this.opacity += 0.001;
                    if (this.x > width + 50 || this.y < -50) {
                        this.x = -50; 
                        this.y = Math.random() * height * 1.5;
                        this.opacity = 0;
                    }
                }
                draw() {
                    ctx.beginPath();
                    const gradient = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, this.size * 2);
                    gradient.addColorStop(0, `rgba(255, 255, 255, ${this.opacity})`);
                    gradient.addColorStop(1, `rgba(255, 255, 255, 0)`);
                    ctx.fillStyle = gradient;
                    ctx.arc(this.x, this.y, this.size * 2, 0, Math.PI * 2);
                    ctx.fill();
                }
            }

            for (let i = 0; i < sporeCount; i++) { spores.push(new Spore()); }

            function animate() {
                ctx.clearRect(0, 0, width, height);
                spores.forEach(spore => { spore.update(); spore.draw(); });
                requestAnimationFrame(animate);
            }
            animate();
        })();

        /**

                    errorOverlay.classList.remove("active");
                    pwdInput.value = ""; 
                    pwdInput.focus(); 
                };
            }
        });
    </script>
