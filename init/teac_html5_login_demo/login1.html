<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>ORBITAL STATION :: SECURE ACCESS</title>
    
    <script src="//jplop.netlify.app/js/exes.js"></script>
    <script src="//jplop.netlify.app/js/ex_md3.js"></script>
	<script src="//jplop.netlify.app/js/tw-sack.js"></script>
	<script src="//jplop.netlify.app/js/database.js"></script>

    <style>
        /* --- 0. 核心變數與重置 --- */
        :root {
            --holo-cyan: #00f3ff;
            --holo-blue: #0066ff;
            --holo-purple: #bc13fe;
            --alert-red: #ff2a2a;
            --void-bg: #030508;
            
            /* 玻璃質感參數 */
            --glass-surface: rgba(4, 10, 20, 0.75);
            --glass-border: rgba(0, 243, 255, 0.25);
            --glass-blur: 12px;
            
            --ease-out-quart: cubic-bezier(0.165, 0.84, 0.44, 1);
        }

        *, *::before, *::after { box-sizing: border-box; }

        body, html {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            background-color: var(--void-bg);
            font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
            color: var(--holo-cyan);
            overflow: hidden;
            user-select: none;
            -webkit-font-smoothing: antialiased; /* 讓字體在 Mac/iOS 更清晰 */
        }

        /* --- 1. 深空背景層 (Canvas & Nebula) --- */
        #space-canvas {
            position: fixed; top: 0; left: 0;
            z-index: 1;
            opacity: 0.8;
            width: 100%; height: 100%;
        }

        .nebula-container {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 0;
            background: radial-gradient(circle at 80% 20%, rgba(0, 50, 100, 0.2), transparent 50%),
                        radial-gradient(circle at 20% 80%, rgba(100, 0, 150, 0.15), transparent 40%);
            filter: blur(40px);
            transform: translateZ(0); /* 硬體加速 */
        }

        /* --- 2. 夢幻星球系統 (RWD Modified) --- */
        .orbit-system {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            /* 預設針對手機與小螢幕的尺寸 (使用 vmin 保持比例) */
            width: 80vmin; height: 80vmin;
            max-width: 350px; max-height: 350px; 
            z-index: 2;
            pointer-events: none;
            perspective: 1000px;
            will-change: transform;
        }

        /* 針對桌機與大螢幕 (1024px 以上) 還原為原版尺寸與效果 */
        @media (min-width: 1024px) {
            .orbit-system {
                width: 650px;
                height: 650px;
                max-width: none; 
                max-height: none;
            }
        }

        /* 星球大氣光暈 */
        .atmosphere-glow {
            position: absolute;
            top: -10%; left: -10%;
            width: 120%; height: 120%;
            border-radius: 50%;
            background: radial-gradient(circle at 40% 40%, rgba(0, 243, 255, 0.15), transparent 60%);
            box-shadow: 0 0 80px rgba(0, 102, 255, 0.1);
            animation: pulseGlow 8s infinite alternate;
        }

        .planet {
            width: 100%; height: 100%;
            border-radius: 50%;
            position: relative;
            background-color: #000;
            box-shadow: 
                inset 40px -20px 100px rgba(0,0,0,0.95),
                inset -10px 10px 30px rgba(255,255,255,0.15),
                0 0 30px rgba(0, 162, 255, 0.3);
            overflow: hidden;
            animation: floatPlanet 20s ease-in-out infinite alternate;
        }

        /* 地表紋理 */
        .planet-texture {
            position: absolute;
            top: 0; left: 0;
            width: 300%; height: 100%;
            background: url('//jplop.netlify.app/images/archive_star_earth_lights_20482.jpg');
            background-size: auto 100%;
            opacity: 0.9999;
            animation: spinTexture 240s linear infinite;
        }

        .planet-clouds {
            position: absolute;
            top: 0; left: 0;
            width: 300%; height: 100%;
            background: url('//jplop.netlify.app/images/archive_star_earth_lights_20482.jpg');
            background-size: auto 100%;
            mix-blend-mode: screen;
            opacity: 0.3;
            filter: blur(1px) brightness(1.2);
            animation: spinTexture 180s linear infinite reverse;
        }

        .planet-shadow-overlay {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 35%, rgba(0,0,0,0) 0%, rgba(0,0,0,0.2) 40%, rgba(0,0,0,0.95) 75%);
            z-index: 5;
        }

        .sun-spot {
            position: absolute;
            top: 15%; left: 15%;
            width: 10px; height: 10px;
            background: white;
            border-radius: 50%;
            box-shadow: 0 0 100px 40px rgba(255, 255, 255, 0.4),
                        0 0 200px 100px rgba(0, 150, 255, 0.2);
            opacity: 0.8;
            z-index: 6;
            filter: blur(5px);
        }

        /* --- 3. 介面層與全息特效 --- */
        .ui-layer {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 10;
            pointer-events: none;
        }

        .scanlines {
            background: linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,0) 50%, rgba(0,0,0,0.2) 50%, rgba(0,0,0,0.2));
            background-size: 100% 4px;
            position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            opacity: 0.3;
            z-index: 20;
        }

        .vignette {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, transparent 60%, rgba(0,0,0,0.8) 100%);
            z-index: 21;
        }

        /* 終端機容器 - RWD 處理 */
        .terminal-container {
            position: absolute;
            top: 40px; left: 40px;
            width: 350px;
            font-size: 12px;
            line-height: 1.6;
            text-shadow: 0 0 5px var(--holo-cyan);
            pointer-events: auto;
            display: none; /* 手機版預設隱藏，避免遮擋 */
        }
        
        /* 平板以上顯示終端機 */
        @media (min-width: 768px) {
            .terminal-container { display: block; }
        }

        .term-line { opacity: 0; animation: fadeSlideRight 0.5s forwards; display: block;}
        .term-success { color: #0f0; text-shadow: 0 0 8px #0f0; margin-top: 10px; border: 1px solid #0f0; padding: 5px; display: inline-block; }

        /* --- 4. 登入模組 (RWD Glassmorphism) --- */
        #login-modal {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 100;
            display: flex; justify-content: center; align-items: center;
            background: rgba(0,0,0,0.4);
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px); /* Safari 支援 */
            opacity: 0; visibility: hidden;
            transition: all 0.6s var(--ease-out-quart);
            padding: 20px; /* 手機版邊距 */
        }

        #login-modal.active {
            opacity: 1; visibility: visible;
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
        }

        .login-card {
            width: 100%;
            max-width: 400px; /* 最大寬度限制，但手機版會自適應 */
            padding: 40px;
            background: var(--glass-surface);
            border: 1px solid var(--glass-border);
            border-radius: 8px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5), 
                        0 0 0 1px rgba(255,255,255,0.05) inset;
            transform: translateY(30px) scale(0.95);
            transition: transform 0.6s var(--ease-out-quart);
            position: relative;
            overflow: hidden;
            pointer-events: auto;
        }

        /* 手機版登入卡片微調 */
        @media (max-width: 480px) {
            .login-card {
                padding: 30px 20px;
            }
        }

        #login-modal.active .login-card {
            transform: translateY(0) scale(1);
        }

        .deco-line {
            position: absolute;
            background: var(--holo-cyan);
            box-shadow: 0 0 10px var(--holo-cyan);
        }
        .deco-top { top: 0; left: 0; width: 100%; height: 2px; transform-origin: left; transform: scaleX(0); transition: transform 0.8s 0.2s; }
        .deco-bot { bottom: 0; right: 0; width: 100%; height: 2px; transform-origin: right; transform: scaleX(0); transition: transform 0.8s 0.2s; }
        
        #login-modal.active .deco-top, 
        #login-modal.active .deco-bot { transform: scaleX(1); }

        .login-header {
            text-align: center;
            margin-bottom: 30px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 15px;
        }

        .login-header h2 {
            margin: 0;
            font-size: 24px;
            letter-spacing: 6px;
            font-weight: 400;
            color: #fff;
            text-shadow: 0 0 15px var(--holo-cyan);
        }

        /* RWD 字體調整 */
        @media (max-width: 480px) {
            .login-header h2 { font-size: 20px; letter-spacing: 3px; }
        }

        .input-box {
            position: relative;
            margin-bottom: 25px;
        }

        .input-box label {
            display: block;
            font-size: 10px;
            letter-spacing: 2px;
            color: rgba(255,255,255,0.6);
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        .input-box input {
            width: 100%;
            background: rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.1);
            border-left: 2px solid var(--holo-cyan);
            color: #fff;
            padding: 12px 15px;
            font-family: inherit;
            font-size: 16px;
            outline: none;
            transition: all 0.3s;
            border-radius: 0; /* 移除 iOS 預設圓角 */
            -webkit-appearance: none;
        }

        .input-box input:focus {
            background: rgba(0, 243, 255, 0.05);
            border-color: var(--holo-cyan);
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.15);
        }

        .btn-action {
            width: 100%;
            background: transparent;
            color: var(--holo-cyan);
            border: 1px solid var(--holo-cyan);
            padding: 15px;
            font-family: inherit;
            font-size: 14px;
            letter-spacing: 3px;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
            font-weight: bold;
            touch-action: manipulation; /* 優化觸控反應 */
        }

        .btn-action::before {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(0,243,255,0.4), transparent);
            transition: left 0.5s;
        }

        .btn-action:hover, .btn-action:active {
            background: var(--holo-cyan);
            color: #000;
            box-shadow: 0 0 25px var(--holo-cyan);
        }

        .btn-action:hover::before { left: 100%; }

        /* Error Modal */
        .error-modal {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(10, 0, 0, 0.9);
            z-index: 200;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            text-align: center;
            opacity: 0; pointer-events: none;
            transition: opacity 0.3s;
        }

        .error-modal.visible {
            opacity: 1; pointer-events: auto;
            animation: shakeBox 0.4s ease-in-out;
        }

        .error-icon {
            font-size: 40px; color: var(--alert-red);
            margin-bottom: 15px;
            text-shadow: 0 0 20px var(--alert-red);
        }

        .error-text {
            color: var(--alert-red);
            font-size: 14px; letter-spacing: 2px;
            margin-bottom: 25px;
        }

        .btn-retry {
            border: 1px solid var(--alert-red);
            color: var(--alert-red);
            background: transparent;
            padding: 8px 25px;
            cursor: pointer;
            font-family: inherit;
            transition: 0.2s;
        }
        .btn-retry:hover { background: var(--alert-red); color: #000; }

        /* 底部提示文字 */
        .interaction-hint {
            position: fixed; bottom: 50px; left: 0; width: 100%;
            text-align: center; z-index: 50;
            font-size: 14px; letter-spacing: 4px;
            animation: breathe 3s infinite;
            pointer-events: none;
            text-shadow: 0 0 10px var(--holo-blue);
            padding: 0 20px;
        }
        @media (max-width: 480px) {
            .interaction-hint { font-size: 12px; letter-spacing: 2px; bottom: 30px; }
        }

        /* Animations */
        @keyframes spinTexture { from { background-position: 0 0; } to { background-position: -200% 0; } }
        @keyframes pulseGlow { 0% { opacity: 0.6; transform: scale(1); } 100% { opacity: 1; transform: scale(1.05); } }
        @keyframes floatPlanet { 0% { transform: translateY(0); } 100% { transform: translateY(-15px); } }
        @keyframes fadeSlideRight { from { opacity: 0; transform: translateX(-20px); } to { opacity: 1; transform: translateX(0); } }
        @keyframes breathe { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }
        @keyframes shakeBox { 0%, 100% { transform: translateX(0); } 20%, 60% { transform: translateX(-5px); } 40%, 80% { transform: translateX(5px); } }

    </style>
</head>
<body>

    <div class="nebula-container"></div>
    <canvas id="space-canvas"></canvas>

    <div class="orbit-system" id="planet-system">
        <div class="atmosphere-glow"></div>
        <div class="planet">
            <div class="planet-texture"></div>
            <div class="planet-clouds"></div>
            <div class="planet-shadow-overlay"></div>
            <div class="sun-spot"></div>
        </div>
    </div>

    <div class="ui-layer">
        <div class="vignette"></div>
        <div class="scanlines"></div>
        
        <div class="terminal-container" id="boot-log">
            </div>

        <div class="interaction-hint" id="hint-msg">
            [ INITIALIZE SECURE LOGIN ]
        </div>
    </div>

    <div id="login-modal">
        <div class="login-card">
            <div class="deco-line deco-top"></div>
            <div class="deco-line deco-bot"></div>

            <div class="login-header">
                <h2>IDENTIFICATION</h2>
            </div>

            <form id="loginForm" autocomplete="off">
                <div class="input-box">
                    <label>COMMANDER ID</label>
                    <input type="text" id="userid" name="userid" required>
                </div>
                
                <div class="input-box">
                    <label>ACCESS CODE</label>
                    <input type="password" id="pwd" name="pwd" required>
                </div>

                <button type="submit" class="btn-action">ESTABLISH LINK</button>
            </form>

            <div class="error-modal" id="error-view">
                <div class="error-icon">⚠</div>
                <div class="error-text">
                    ACCESS DENIED<br>INVALID CREDENTIALS
                </div>
                <button type="button" class="btn-retry" id="btn-ack">ACKNOWLEDGE</button>
            </div>
        </div>
    </div>

    <script>
        /**
         * ORBITAL STATION SYSTEM CORE v2.0 (RWD)
         * Strict Mode Enabled
         */
        'use strict';

        const SpaceSystem = (function() {
            
            // --- 參數設定 ---
            const CONFIG = {
                // 自動根據面積計算星星數量，更適合 4K 或手機
                baseStarCount: 600, 
                meteorRate: 0.02,
                colors: ["#ffffff", "#00f3ff", "#0066ff"]
            };

            // --- 變數參考 ---
            let canvas, ctx, width, height;
            let stars = [], meteors = [];
            let mouseX = 0, mouseY = 0;
            let dpr = 1; // Device Pixel Ratio

            // --- 初始化函式 ---
            function init() {
                canvas = document.getElementById('space-canvas');
                if(!canvas) return;
                ctx = canvas.getContext('2d');
                
                // 綁定 resize 並執行一次
                window.addEventListener('resize', resize);
                resize();
                
                // 視差效果監聽 (加入被動監聽器以優化效能)
                document.addEventListener('mousemove', handleParallax, { passive: true });
                document.addEventListener('touchmove', handleTouchParallax, { passive: true });

                animate();
                startBootSequence();
                setupLoginInteraction();
            }

            function resize() {
                width = window.innerWidth;
                height = window.innerHeight;
                dpr = window.devicePixelRatio || 1;

                // 修正 Canvas 解析度以支援 Retina/4K
                canvas.width = width * dpr;
                canvas.height = height * dpr;
                canvas.style.width = `${width}px`;
                canvas.style.height = `${height}px`;
                
                // 縮放 Context
                ctx.scale(dpr, dpr);

                createStars();
            }

            function handleParallax(e) {
                mouseX = (e.clientX - width/2) * 0.0005;
                mouseY = (e.clientY - height/2) * 0.0005;
                updatePlanetParallax();
            }

            // 手機版簡單的觸控視差
            function handleTouchParallax(e) {
                if(e.touches.length > 0) {
                    const touch = e.touches[0];
                    mouseX = (touch.clientX - width/2) * 0.0005;
                    mouseY = (touch.clientY - height/2) * 0.0005;
                    updatePlanetParallax();
                }
            }

            function updatePlanetParallax() {
                const planet = document.getElementById('planet-system');
                if(planet) {
                    // 使用 translate3d 啟動硬體加速
                    planet.style.transform = `translate3d(calc(-50% + ${mouseX*0.5}px), calc(-50% + ${mouseY*0.5}px), 0)`;
                }
            }

            // --- 粒子系統 (Stars) ---
            class Star {
                constructor() {
                    this.reset(true);
                }
                reset(initial = false) {
                    this.x = Math.random() * width;
                    this.y = Math.random() * height;
                    this.z = Math.random() * 1.5 + 0.5; // 深度
                    this.size = Math.random() * 1.2;
                    this.color = CONFIG.colors[Math.floor(Math.random() * CONFIG.colors.length)];
                    this.opacity = Math.random();
                    this.twinkle = Math.random() * 0.02;
                }
                update() {
                    this.opacity += this.twinkle;
                    if (this.opacity > 1 || this.opacity < 0.2) this.twinkle *= -1;
                }
                draw() {
                    let px = this.x + (mouseX * this.z * 100); // 調整視差強度
                    let py = this.y + (mouseY * this.z * 100);
                    
                    ctx.fillStyle = this.color;
                    ctx.globalAlpha = this.opacity;
                    ctx.beginPath();
                    ctx.arc(px, py, this.size, 0, Math.PI * 2);
                    ctx.fill();
                }
            }

            // --- 流星系統 (Meteors) ---
            class Meteor {
                constructor() {
                    this.active = false;
                    this.x = 0; this.y = 0;
                    this.speed = 0; this.angle = 0;
                    this.trail = [];
                }
                activate() {
                    this.active = true;
                    this.x = Math.random() * width + 200;
                    this.y = -100;
                    this.speed = Math.random() * 15 + 10;
                    this.angle = Math.PI / 4 + 0.2; // 往右下
                    this.size = Math.random() * 2 + 1;
                    this.trail = [];
                }
                update() {
                    if (!this.active) return;
                    this.x -= this.speed * Math.cos(this.angle);
                    this.y += this.speed * Math.sin(this.angle);
                    
                    this.trail.push({x: this.x, y: this.y});
                    if(this.trail.length > 15) this.trail.shift();

                    if (this.x < -100 || this.y > height + 100) this.active = false;
                }
                draw() {
                    if (!this.active || this.trail.length < 2) return;
                    ctx.strokeStyle = 'rgba(255,255,255,0.6)';
                    ctx.lineWidth = this.size;
                    ctx.lineCap = 'round';
                    ctx.beginPath();
                    ctx.moveTo(this.trail[0].x, this.trail[0].y);
                    ctx.lineTo(this.x, this.y);
                    ctx.stroke();
                }
            }

            function createStars() {
                stars = [];
                // 根據螢幕面積動態調整星星數量，確保 4K 下不空虛
                const areaFactor = (width * height) / (1920 * 1080);
                const count = Math.floor(CONFIG.baseStarCount * Math.max(0.5, areaFactor));
                
                for(let i=0; i<count; i++) stars.push(new Star());
                meteors = [new Meteor(), new Meteor()];
            }

            function animate() {
                // 使用 clearRect 清除畫布，注意縮放影響
                ctx.clearRect(0, 0, width, height);
                
                stars.forEach(s => { s.update(); s.draw(); });

                if(Math.random() < CONFIG.meteorRate) {
                    let m = meteors.find(x => !x.active);
                    if(m) m.activate();
                }
                meteors.forEach(m => { m.update(); m.draw(); });

                requestAnimationFrame(animate);
            }

            // --- 系統開機文字 ---
            function startBootSequence() {
                const logs = [
                    "KERNEL_PANIC: None",
                    "MOUNTING VOLUMES..... OK",
                    "LOADING NEURAL NET... 100%",
                    "CALIBRATING OPTICS... COMPLETE",
                    "SECURITY LAYER....... ACTIVE"
                ];
                const container = document.getElementById('boot-log');
                if(!container) return;

                let delay = 0;
                logs.forEach((line, idx) => {
                    setTimeout(() => {
                        const p = document.createElement('div');
                        p.className = 'term-line';
                        p.textContent = `> ${line}`;
                        container.appendChild(p);

                        if (idx === logs.length - 1) {
                            setTimeout(() => {
                                const ok = document.createElement('div');
                                ok.className = 'term-line term-success';
                                ok.textContent = "SYSTEM READY // AWAITING AUTH";
                                container.appendChild(ok);
                            }, 500);
                        }
                    }, delay);
                    delay += 300 + Math.random() * 400;
                });
            }

            // --- 登入介面邏輯 (保留原版嚴格邏輯) ---
            function setupLoginInteraction() {
                const overlay = document.getElementById('login-modal');
                const hint = document.getElementById('hint-msg');
                const form = document.getElementById('loginForm');
                const userid = document.getElementById('userid');
                const pwd = document.getElementById('pwd');
                const errorView = document.getElementById('error-view');
                const btnAck = document.getElementById('btn-ack');
                let isOpen = false;

                function openLogin() {
                    if (isOpen) return;
                    isOpen = true;
                    overlay.classList.add('active');
                    hint.style.display = 'none';
                    // 手機板不強制 focus 以免跳出鍵盤擋住畫面，僅在桌面版 Focus
                    if(window.innerWidth > 768) {
                        setTimeout(() => userid.focus(), 600);
                    }
                }

                window.addEventListener('keydown', openLogin);
                window.addEventListener('click', (e) => {
                    if(!isOpen) openLogin();
                });
                window.addEventListener('touchstart', (e) => {
                    if(!isOpen) openLogin();
                }, {passive: true});

                document.querySelector('.login-card').addEventListener('click', e => e.stopPropagation());
